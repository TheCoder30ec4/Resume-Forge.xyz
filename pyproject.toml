[project]
name = "resumebuilder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apify-client>=2.5.0",
    "beautifulsoup4>=4.14.3",
    "deepagents>=0.5.7",
    "httpx>=0.27",
    "langchain>=1.2.15",
    "langchain-groq>=1.1.2",
    "langgraph>=1.1.6",
    "linkedin-api>=2.3.1",
    "playwright>=1.58.0",
    "python-dotenv>=1.2.2",
    "rendercv[full]>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that hit a real LLM API (skip without GROQ_API)",
    "e2e: end-to-end workflow tests (slow, may hit external APIs)",
]
