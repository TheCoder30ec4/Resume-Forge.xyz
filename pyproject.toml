[project]
name = "resumebuilder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "apify-client>=2.5.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.14.3",
    "deepagents>=0.5.7",
    "fastapi>=0.136.1",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "langchain>=1.2.15",
    "langchain-groq>=1.1.2",
    "langgraph>=1.1.6",
    "linkedin-api>=2.3.1",
    "passlib>=1.7.4",
    "playwright>=1.58.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.28",
    "redis>=7.4.0",
    "rendercv[full]>=2.8",
    "sqlalchemy>=2.0",
    "uvicorn>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that hit a real LLM API (skip without GROQ_API)",
    "e2e: end-to-end workflow tests (slow, may hit external APIs)",
]
